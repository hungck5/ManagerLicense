name: manager-license

x-dotnet: &dotnet
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: 8080
  healthcheck: &http-health
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth-server:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: AuthServer }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AuthDatabase;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__Initialize: "true"
      Auth__Issuer: http://localhost:7130/
      Auth__AllowHttp: "true"
      Auth__ReactUrl: http://localhost:3000/
      Auth__EcommerceUrl: http://localhost:7294/
      Auth__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      sqlserver: { condition: service_healthy }

  ecommerce-api:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: EcommerceApi }
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EcommerceApi;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__Initialize: "true"
    depends_on:
      sqlserver: { condition: service_healthy }

  api-gateway:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: ApiGateway }
    ports: ["127.0.0.1:7130:8080"]
    environment:
      <<: *dotnet-env
      Cors__FrontendOrigin: http://localhost:3000
      ReverseProxy__Clusters__api_cluster__Destinations__api_service__Address: http://ecommerce-api:8080/
      ReverseProxy__Clusters__auth_cluster__Destinations__auth_service__Address: http://auth-server:8080/
    depends_on:
      auth-server: { condition: service_healthy }
      ecommerce-api: { condition: service_healthy }

  admin-dashboard:
    build: ./my-admin-dashboard
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api-gateway: { condition: service_healthy }

  ecommerce:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: Ecommerce }
    ports: ["127.0.0.1:7294:8080"]
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EcommerceStore;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__Initialize: "true"
      Auth__Authority: http://localhost:7130/
      Auth__InternalAuthority: http://api-gateway:8080/
      Auth__AllowHttp: "true"
    depends_on:
      sqlserver: { condition: service_healthy }
      api-gateway: { condition: service_healthy }

  license-manager:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: LicenseManagerApp }
    ports: ["127.0.0.1:5237:8080"]
    environment:
      <<: *dotnet-env
      License__KeyDirectory: /app/keys
    volumes: ["license-keys:/app/keys"]

  mvc-app:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: MvcApp }
    ports: ["127.0.0.1:5080:8080"]
    environment:
      <<: *dotnet-env
      ApiSettings__BaseUrl: http://license-manager:8080
      License__FilePath: /app/data/license.json
    volumes: ["mvc-data:/app/data"]
    depends_on:
      license-manager: { condition: service_healthy }

  product-test:
    <<: *dotnet
    build:
      context: .
      args: { PROJECT: ProductTest }
    ports: ["127.0.0.1:5001:8080"]

volumes:
  sql-data:
  license-keys:
  mvc-data:
